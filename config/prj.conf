CONFIG_BT_DEVICE_NAME="chocofi_nn"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y

# Deep sleep enabled 2026-10-12. It was =n from the day this file was written
# (commit 60430e3, 2025-01-07), with no reason recorded; leaving it off costs
# significant battery on a wireless board. If idle wake-up proves unreliable,
# this is the line to suspect.
CONFIG_ZMK_SLEEP=y
