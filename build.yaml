# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command and `artifact-name` to assign a name to
# distinguish build outputs from each other:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#   - board: nice_nano_v2
#     shield: corne_left
#     cmake-args: -DCONFIG_ZMK_USB_LOGGING=y
#     artifact-name: corne_left_with_logging
#
# NOTE: the examples above are ZMK's stock template and are now stale.
#
# ZMK has moved to Zephyr 4.1 and its hardware model v2, which changed the
# board target in TWO independent ways. Both must be right or the build fails:
#
#   1. REVISION. There is no `nice_nano_v2` board any more. There is one
#      `nice_nano` with revisions 1.0.0 and 2.0.0, and 2.0.0 is the default.
#      Getting this wrong fails at CMake with "No board named ... found".
#   2. VARIANT. Every board in the ZMK tree must now be selected with its
#      `zmk` variant, because ZMK extends the stock Zephyr board rather than
#      replacing it. Plain `nice_nano` builds the STOCK Zephyr board, links
#      successfully, and is then rejected by the workflow's "Missing ZMK
#      Compat" guard -- so a bare board name looks like a compile failure
#      while actually being a board-selection mistake.
#
# `nice_nano//zmk` is ZMK's documented replacement for `nice_nano_v2`. The
# empty middle field is the SoC, omitted because the board has only one. In
# full it is `nice_nano@2.0.0//zmk`; for the V1 board it would be
# `nice_nano@1.0.0//zmk`. Both failures were hit in order on 2026-10-12.
# Reference: https://zmk.dev/blog/2025/12/09/zephyr-4-1#zmk-board-variant
---
include:
  - board: nice_nano//zmk
    shield: corne_left
  - board: nice_nano//zmk
    shield: corne_right
  - board: nice_nano//zmk
    shield: settings_reset
